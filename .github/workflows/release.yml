name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Verify release assets
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          node -e "const m=require('./manifest.json'); const t=process.env.GITHUB_REF_NAME; if(m.version!==t){console.error('Tag',t,'!= manifest version',m.version); process.exit(1)}"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes=$(awk '/^## \[/{if(found) exit; found=1; next} found' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="MarkPress ${tag}"
          fi
          # Published (not draft) so Obsidian Community Plugins can resolve the version.
          gh release create "$tag" \
            --title="MarkPress ${tag}" \
            --notes="$notes" \
            main.js manifest.json styles.css

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
